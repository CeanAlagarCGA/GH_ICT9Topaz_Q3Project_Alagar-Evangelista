<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fare Matrix</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("https://static.vecteezy.com/system/resources/thumbnails/050/952/977/small/motorcycle-on-a-road-with-headlights-in-the-background-photo.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;           
            flex-direction: column; 
            min-height: 100vh;      
        }

        nav {
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 6px;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li {
            display: inline;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #000000;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            color: #fffb0b;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 3px solid lch(100% 0.01 296.81);
            display: inline-block;
            padding-bottom: 5px;
        }

        .btn {
            background: #ffcc00;
            padding: 8px 15px;
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }

        .container {
            padding: 50px;
            text-align: center;
            margin-top: 300px; 
        }

        select {
            padding: 10px;
            margin: 10px;
            width: 220px;
        }

        button {
            padding: 10px 20px;
            background: #ffcc00;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }

        button:hover {
            background: #ffaa00;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: auto;        
    width: 100%;             
}
    </style>
</head>
<body>

<nav>
    <div class="logo">ESakay</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="fare-matrix.html">Fare Matrix</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="help.html">Help</a></li>
    </ul>
    <a href="register.html" class="btn">Create Account</a>
</nav>

<header>
    
</header>

<div class="container">

    <h3>Select Pickup and Drop-off Stations</h3>

    <select id="pickup">
        <option value="">-- Select Pickup --</option>
    </select>

    <select id="dropoff">
        <option value="">-- Select Drop-off --</option>
    </select>

    <br>

    <label>Passenger Type:</label>
    <select id="passengerType">
        <option value="regular">Regular</option>
        <option value="discount">Senior / PWD / Student</option>
    </select>

    <br><br>

    <button onclick="calculateFare()">Calculate Fare</button>

    <div id="result"></div>

</div>

<footer>
   <p>Cean Alagar & Benjamin Evangelista </p>
    <p>9-Topaz</p>
</footer>

        <script>     
            const profileInput = document.getElementById('profile');
            const profilePreview = document.getElementById('profilePreview');

            profilePreview.onclick = () => profileInput.click();
            profileInput.onchange = e => e.target.files[0] && (profilePreview.src = URL.createObjectURL(e.target.files[0]));
        </script>
   

    
</script>

</body>

</html>
