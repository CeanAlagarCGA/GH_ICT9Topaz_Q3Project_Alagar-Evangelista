<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background-image: url("https://static.vecteezy.com/system/resources/thumbnails/050/952/977/small/motorcycle-on-a-road-with-headlights-in-the-background-photo.jpg");
    background-size: cover;        
    background-position: center;   
    background-repeat: no-repeat;  
    background-attachment: fixed;  
    display: flex;
    flex-direction: column;
}

      nav {
    position: fixed;
    width: 100%;
    top: 0;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 6px;
    z-index: 100;
}

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li {
            display: inline;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #000000;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            color: #fffb0b;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 3px solid lch(100% 0.01 296.81);
            display: inline-block;
            padding-bottom: 5px;
        }

        .btn {
            background: #ffcc00;
            padding: 8px 15px;
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }


        .popup-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
        }

        .popup-form {
            background: rgb(255, 255, 255);
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .popup-form input,
        .popup-form select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .popup-form label {
            font-weight: bold;
        }

        #successToggle {
            display: none;
        }

        .confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .confirmation-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 350px;
        }

        #successToggle:checked ~ .confirmation-modal {
            display: flex;
        }

        .confirmation-box .btn {
            display: inline-block;
            margin-top: 20px;
        }

        #profilePreview {
            width: 250px;                  
            height: 250px;                 
            border-radius: 50%;           
            object-fit: cover;
            border: 4px solid #6b73ff;    
            box-shadow: 0 0 0 8px rgba(107, 115, 255, 0.5); 
            cursor: pointer;              
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
            margin: 34px; 
        }

        #profilePreview:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ffff, 0 0 0 8px rgba(107, 115, 255, 0.5);
        }

        
        footer {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }

    </style>
</head>
<body>

<nav>
    <div class="logo">ESakay</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="fare-matrix.html">Fare Matrix</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="help.html">Help</a></li>
    </ul>
    <a href="register.html" class="btn">Create Account</a>
</nav>

<input type="checkbox" id="successToggle">

<div class="popup-container">
    <div class="popup-form">
        <h2>Create Account</h2>

        <form>
            <div class="form-group">
                <label for="profile">Profile Picture</label>
                <img id="profilePreview" src="https://png.pngtree.com/png-clipart/20250810/original/pngtree-d-purple-user-profile-icon-design-for-websites-and-mobile-applications-png-image_21729921.png" alt="Profile Preview"> <br>
                <input type="file" id="profile" name="profile" accept="image/*">


                <label>Full Name</label>
                <input type="text" >

                <label>Email</label>
                <input type="email" >

                <label>Password</label>
                <input type="password" >

                <label>Passenger Type</label>
                <select>
                    <option>Regular</option>
                    <option>Senior</option>
                    <option>PWD</option>
                    <option>Student</option>
                </select>

                <label for="successToggle" class="btn" style="display:block; text-align:center; cursor:pointer;" >
                   <a href="confirmation.html">Register</a>
                </label>
            </div>
        </form>
    </div>
</div>




<footer>
   <p>Cean Alagar & Benjamin Evangelista </p>
    <p>9-Topaz</p>
</footer>
        <script src="proj.js"></script>
</body>
</html>
